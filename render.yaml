services:
  - type: web
    runtime: static
    name: zem-tarif
    buildCommand: npm ci && npx expo export --platform web
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: EXPO_PUBLIC_API_URL
        value: https://zem-tarif-api.onrender.com

  # La base zem-tarif-db existe déjà dans l'espace de travail (plan gratuit).
  # Elle n'est pas redéclarée ici, pour éviter d'en créer une deuxième.
  - type: web
    name: zem-tarif-api
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /sante
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: DATABASE_URL
        fromDatabase:
          name: zem-tarif-db
          property: connectionString
